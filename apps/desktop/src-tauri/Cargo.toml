[package]
name = "trackers-desktop"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[lib]
name = "trackers_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rule-format = { path = "../../../crates/rule-format" }
scanner-core = { path = "../../../crates/scanner-core" }
rule-compiler = { path = "../../../tools/rule-compiler" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.2", features = [] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[dev-dependencies]
tempfile = "3"

[features]
custom-protocol = ["tauri/custom-protocol"]
